name: travellucky
services:
  app:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/travellucky:${IMAGE_TAG:-latest}
    pull_policy: always
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${APP_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - app-data:/app/backend/data
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app-data:
